# GitHub Actions workflow: VEX Visualizer usage report (Google Analytics 4)
#
# Runs visualizer/usage_report.py and commits analytics/USAGE_REPORT.md and
# analytics/usage.json: month-by-month visitors, this season vs last season
# (the growth multiple), sections opened and clicks, countries and devices.
# It never touches the site files.
#
# Schedule: the 1st of every month at 07:00 UTC, plus manual runs from the
# Actions tab (for example after Worlds or a big signature weekend).
#
# Secret: GOOGLE_ANALYTICS_CREDENTIALS = the JSON key of a Google Cloud service
# account that has Viewer access to the GA4 property (GA4 Admin > Property
# access management).

name: Analytics Report

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:

concurrency:
  group: analytics-report
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from October 19, 2026
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the GA4 client
        run: pip install --quiet google-analytics-data

      - name: Build the usage report
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_ANALYTICS_CREDENTIALS }}
        run: python -u visualizer/usage_report.py

      - name: Commit the report
        run: |
          git add analytics
          if git diff --cached --quiet; then
            echo "No changes to the report."
            exit 0
          fi
          git config user.name "VEX Visualizer Bot"
          git config user.email "actions@github.com"
          git commit -m "[Analytics] Usage report: $(date -u +'%Y-%m-%d')"
          git pull --rebase --quiet origin main
          git push
