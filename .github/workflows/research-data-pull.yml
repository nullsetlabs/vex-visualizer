# GitHub Actions Workflow: Research Data Pull (Schedule-Strength Project)
# Manual trigger only. Writes ONLY to research/data/raw/. Five-layer safety.

name: Research Data Pull

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'RobotEvents season ID (197 = Push Back 2025-26)'
        required: true
        default: '197'
        type: string
      grade:
        description: 'Grade level'
        required: true
        default: 'high'
        type: choice
        options:
          - high
          - middle
      skip_preworlds:
        description: 'Skip per-team pre-Worlds aggregation (fast smoke test)'
        required: false
        default: false
        type: boolean

concurrency:
  group: research-data-pull
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PROTECTED_FILES: |
        teams_data.json
        ms_teams_data.json
        index.html
        version.json
        update_data.py
        fetch_ms_data.py
        vex_visualizer_template.html
        analytics_report.py
        ANALYTICS_REPORT.md

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify research scripts present
        run: |
          set -e
          for f in research/src/ingest.py research/src/__init__.py; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Required file missing: $f"
              exit 1
            fi
          done
          echo "OK: research scripts present."

      - name: Record SHA-256 of protected files (pre-flight)
        run: |
          set -e
          : > /tmp/protected-before.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -f "$f" ]; then
              sum=$(sha256sum "$f" | cut -d' ' -f1)
              echo "$sum  $f" >> /tmp/protected-before.txt
            else
              echo "MISSING  $f" >> /tmp/protected-before.txt
            fi
          done <<< "$PROTECTED_FILES"
          echo "Pre-flight checksums:"
          cat /tmp/protected-before.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow

      - name: Compute output directory
        id: output_dir
        run: |
          dir="research/data/raw/season_${{ inputs.season }}_${{ inputs.grade }}"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Output: $dir"

      - name: Diagnose API + token
        env:
          ROBOTEVENTS_TOKEN: ${{ secrets.ROBOTEVENTS_TOKEN }}
        run: |
          if [ -z "$ROBOTEVENTS_TOKEN" ]; then
            echo "::error::ROBOTEVENTS_TOKEN secret is empty"
            exit 1
          fi
          echo "Token length: ${#ROBOTEVENTS_TOKEN} chars"
          BASE="https://events.vex.com/api/v2"
          HDR="Authorization: Bearer $ROBOTEVENTS_TOKEN"

          test_url() {
            local label="$1"
            local url="$2"
            local outfile="/tmp/diag_$(date +%s%N).json"
            echo "=== $label ==="
            echo "  URL: $url"
            local code
            code=$(curl -sS -o "$outfile" -w "%{http_code}" \
              -H "$HDR" -H "Accept: application/json" --max-time 30 "$url" || echo "000")
            local size
            size=$(wc -c < "$outfile" 2>/dev/null || echo 0)
            echo "  HTTP $code | $size bytes"
            if [ -s "$outfile" ]; then
              echo "  Response (first 500 chars):"
              head -c 500 "$outfile" | sed 's/^/    /'
              echo ""
            fi
            echo ""
          }

          echo "=== Baseline: GET / (no auth) ==="
          curl -sS -o /dev/null -w "  HTTP %{http_code}\n" --max-time 10 \
            "https://events.vex.com/" || true
          echo ""

          test_url "1. List V5RC seasons (program=1)" \
            "$BASE/seasons?program%5B%5D=1&per_page=5"
          test_url "2. Get season 197 metadata" \
            "$BASE/seasons/197"
          test_url "3. List events in season 197" \
            "$BASE/seasons/197/events?per_page=3"
          test_url "4. List Worlds-level events in season 197" \
            "$BASE/events?program%5B%5D=1&season%5B%5D=197&level%5B%5D=World&per_page=5"
          test_url "5. List all programs" \
            "$BASE/programs?per_page=5"
          echo "=== Diagnostic complete ==="

      - name: Run ingest
        env:
          ROBOTEVENTS_TOKEN: ${{ secrets.ROBOTEVENTS_TOKEN }}
          PYTHONUNBUFFERED: '1'
        working-directory: research
        run: |
          set -e
          args=(--season "${{ inputs.season }}" --grade "${{ inputs.grade }}" \
                --output "../${{ steps.output_dir.outputs.dir }}")
          if [ "${{ inputs.skip_preworlds }}" = "true" ]; then
            args+=(--skip-preworlds)
          fi
          echo "Invoking: python -m src.ingest ${args[*]}"
          python -m src.ingest "${args[@]}"

      - name: Verify protected files were NOT modified
        if: always()
        run: |
          set -e
          : > /tmp/protected-after.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -f "$f" ]; then
              sum=$(sha256sum "$f" | cut -d' ' -f1)
              echo "$sum  $f" >> /tmp/protected-after.txt
            else
              echo "MISSING  $f" >> /tmp/protected-after.txt
            fi
          done <<< "$PROTECTED_FILES"
          if ! diff -q /tmp/protected-before.txt /tmp/protected-after.txt > /dev/null; then
            echo "::error::Protected files were modified!"
            diff /tmp/protected-before.txt /tmp/protected-after.txt || true
            exit 1
          fi
          echo "OK: all protected files unchanged."

      - name: Show coverage report
        if: always()
        run: |
          cov="${{ steps.output_dir.outputs.dir }}/coverage.md"
          if [ -f "$cov" ]; then
            echo "=== Coverage Report ==="
            cat "$cov"
            cat "$cov" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "(no coverage.md produced)"
          fi

      - name: Inspect changes — must be confined to research/
        run: |
          set -e
          changed=$(git status --porcelain | awk '{print $2}')
          if [ -z "$changed" ]; then
            echo "No files changed."
            exit 0
          fi
          echo "Files changed:"
          echo "$changed"
          out_of_scope=$(echo "$changed" | grep -vE '^research/' || true)
          if [ -n "$out_of_scope" ]; then
            echo "::error::Files changed outside research/:"
            echo "$out_of_scope"
            exit 1
          fi
          echo "OK: changes confined to research/."

      - name: Commit research/data changes to main
        run: |
          set -e
          git config user.name "VEX Research Bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add research/data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          TS=$(date -u +"%Y-%m-%d %H:%M UTC")
          SKIP="${{ inputs.skip_preworlds }}"
          if [ "$SKIP" = "true" ]; then SUFFIX=" (smoke)"; else SUFFIX=""; fi
          git commit -m "[Research] Pull season ${{ inputs.season }} ${{ inputs.grade }}$SUFFIX — $TS"
          git push origin main

      - name: Summary
        if: always()
        run: |
          echo "### Research Data Pull" >> "$GITHUB_STEP_SUMMARY"
          echo "- Season: ${{ inputs.season }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Grade: ${{ inputs.grade }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Skip pre-Worlds: ${{ inputs.skip_preworlds }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Output: ${{ steps.output_dir.outputs.dir }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ Pull completed and committed to main." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ Pull failed or aborted. Visualizer is UNAFFECTED — protected files were not modified." >> "$GITHUB_STEP_SUMMARY"
          fi
