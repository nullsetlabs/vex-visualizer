# GitHub Actions workflow: update the VEX Visualizer season data (2026-2027 Override)
#
# Runs visualizer/season_pipeline.py and commits visualizer/data/ when it changes.
# The page (visualizer/index.html) is static and reads those JSON files, so
# there is no HTML rebuild step. The Worlds 2026 archive in
# visualizer/worlds-2026/ is frozen and never touched by this workflow.
#
# Schedule
#   - Every 30 minutes, "live" mode: fetches only events in progress (start-1
#     day to end+1 day). When nothing is running it exits in seconds and
#     writes nothing. Runs every day because some signature events (Asia)
#     are held midweek.
#   - Once a day at 06:17 UTC, "full" mode: refreshes the season event list,
#     fetches newly finished events and the official skills standings.
#   - Manual: Actions tab > Update VEX Visualizer Data > Run workflow.
#
# Secret: ROBOTEVENTS_TOKEN = an events.vex.com API v2 token.

name: Update VEX Visualizer Data

on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = event list + new events + standings; live = events in progress only; rebuild = no API calls'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - live
          - rebuild

concurrency:
  group: data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "17 6 * * *" ]; then
            MODE="full"
          else
            MODE="live"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"

      - name: Run season pipeline
        working-directory: visualizer
        env:
          ROBOTEVENTS_TOKEN: ${{ secrets.ROBOTEVENTS_TOKEN }}
        run: |
          case "${{ steps.mode.outputs.mode }}" in
            full)    python -u season_pipeline.py --budget-min 20 ;;
            live)    python -u season_pipeline.py --live --budget-min 10 ;;
            rebuild) python -u season_pipeline.py --rebuild ;;
          esac

      - name: Check the data files
        run: |
          python - <<'EOF'
          import json, os
          d = "visualizer/data"
          for f in ("events.json", "teams.json", "season.json", "skills.json", "meta.json"):
              p = os.path.join(d, f)
              if os.path.exists(p):
                  json.load(open(p, encoding="utf-8"))
          print("Data files are valid JSON")
          EOF

      - name: Commit and push
        run: |
          git add visualizer/data
          if git diff --cached --quiet; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          git config user.name "VEX Visualizer Bot"
          git config user.email "actions@github.com"
          SUMMARY=$(python3 -c "import json; m=json.load(open('visualizer/data/meta.json')); print(f\"{m.get('eventsCached', 0)} events, {m.get('teams', 0)} teams\")")
          git commit -m "[${{ steps.mode.outputs.mode }}] Season data: $SUMMARY: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --quiet origin main
          git push

      - name: Summary
        if: always()
        run: |
          echo "### VEX Visualizer season data" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: ${{ steps.mode.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f visualizer/data/meta.json ]; then
            echo "- Meta: $(cat visualizer/data/meta.json)" >> "$GITHUB_STEP_SUMMARY"
          fi
